<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Intake Wizard</title>
    <style>
      :root {
        --bg: #edf5fb;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0a467d;
        --text: #183246;
        --muted: #678099;
        --border: #dfeaf5;
        --success: #0d7d61;
        --error: #c63d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #edf5fd 0%, #f9fbff 100%);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .wizard-card {
        width: min(100%, 720px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 16px 38px rgba(17, 42, 63, 0.08);
      }

      .hero {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 28px 26px 22px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 2.5vw, 2.8rem);
      }

      .hero p {
        margin: 10px 0 0;
        color: rgba(255,255,255,0.86);
        line-height: 1.5;
      }

      form {
        padding: 28px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      input,
      textarea,
      select {
        width: 100%;
        background: #f9fbfd;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 1rem;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .voice-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      .voice-button,
      .primary-button,
      .secondary-button {
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        padding: 12px 16px;
      }

      .voice-button {
        background: #edf4fb;
        color: var(--primary-dark);
      }

      .primary-button {
        background: var(--primary);
        color: white;
        width: 100%;
      }

      .secondary-button {
        background: #edf3f8;
        color: var(--text);
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        font-size: 0.96rem;
        font-weight: 700;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      @media (max-width: 640px) {
        .row, .actions {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="wizard-card">
      <section class="hero">
        <h1>Project intake</h1>
        <p>Share a short project description, plus the dates and location. This form saves the details to the API in the format the backend expects.</p>
      </section>

      <form id="projectWizard" novalidate>
        <div class="field">
          <label for="projectName">Project name</label>
          <input id="projectName" name="projectName" type="text" placeholder="Example: Lakeview Utility Upgrade" />
          <div class="voice-row">
            <button type="button" class="voice-button" id="voiceButton">Use voice input</button>
          </div>
        </div>

        <div class="field">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" placeholder="Example: Harbor Utilities" />
        </div>

        <div class="row">
          <div class="field">
            <label for="county">County</label>
            <select id="county" name="county">
              <option value="Orange">Orange</option>
              <option value="Volusia">Volusia</option>
              <option value="Leon">Leon</option>
              <option value="Miami-Dade">Miami-Dade</option>
            </select>
          </div>

          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Example: We are upgrading the water main and sidewalk in the downtown corridor."></textarea>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="startDate">Start date</label>
            <input id="startDate" name="startDate" type="date" />
          </div>

          <div class="field">
            <label for="endDate">End date</label>
            <input id="endDate" name="endDate" type="date" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary-button">Save details</button>
          <button type="button" class="secondary-button" id="clearButton">Clear</button>
        </div>

        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const STORAGE_KEY = 'projectWizardDraft';
      const form = document.getElementById('projectWizard');
      const projectNameInput = document.getElementById('projectName');
      const companyInput = document.getElementById('company');
      const descriptionInput = document.getElementById('description');
      const countyInput = document.getElementById('county');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const statusElement = document.getElementById('status');

      function setStatus(message, type = '') {
        statusElement.textContent = message;
        statusElement.className = 'status';
        if (type) {
          statusElement.classList.add(type);
        }
      }

      function restoreDraft() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        try {
          const draft = JSON.parse(raw);
          projectNameInput.value = draft.projectName || '';
          companyInput.value = draft.company || '';
          descriptionInput.value = draft.description || '';
          countyInput.value = draft.county || 'Orange';
          startDateInput.value = draft.startDate || '';
          endDateInput.value = draft.endDate || '';
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      function saveDraft() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          projectName: projectNameInput.value.trim(),
          company: companyInput.value.trim(),
          description: descriptionInput.value.trim(),
          county: countyInput.value,
          startDate: startDateInput.value,
          endDate: endDateInput.value
        }));
      }

      function validateProject() {
        if (!projectNameInput.value.trim()) {
          return 'Please enter a project name.';
        }

        if (!startDateInput.value) {
          return 'Please select a start date.';
        }

        if (!endDateInput.value) {
          return 'Please select an end date.';
        }

        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);

        if (Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) {
          return 'Please provide valid dates.';
        }

        if (endDate < startDate) {
          return 'End date must be on or after the start date.';
        }

        return '';
      }

      [projectNameInput, companyInput, descriptionInput, countyInput, startDateInput, endDateInput].forEach((field) => {
        field.addEventListener('input', saveDraft);
        field.addEventListener('change', saveDraft);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const errorMessage = validateProject();
        if (errorMessage) {
          setStatus(errorMessage, 'error');
          return;
        }

        const payload = {
          title: projectNameInput.value.trim(),
          description: descriptionInput.value.trim(),
          county: countyInput.value,
          startTime: new Date(startDateInput.value).toISOString(),
          endTime: new Date(endDateInput.value).toISOString(),
          company: companyInput.value.trim() || 'Unspecified'
        };

        try {
          const response = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || 'Failed to save project details.');
          }

          saveDraft();
          setStatus('Project details saved successfully.', 'success');
        } catch (error) {
          setStatus(error.message || 'Unable to save project details.', 'error');
        }
      });

      document.getElementById('clearButton').addEventListener('click', () => {
        form.reset();
        localStorage.removeItem(STORAGE_KEY);
        setStatus('Draft cleared.', 'success');
      });

      document.getElementById('voiceButton').addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          setStatus('Voice input is not supported in this browser.', 'error');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          const transcript = Array.from(event.results).map((result) => result[0].transcript).join(' ').trim();
          if (transcript) {
            descriptionInput.value = transcript;
            saveDraft();
            setStatus('Voice transcript captured for the project description.', 'success');
          }
        };

        recognition.onerror = () => {
          setStatus('Voice capture could not be completed. Please type the description manually.', 'error');
        };

        recognition.start();
      });

      restoreDraft();
    </script>
  </body>
</html>
