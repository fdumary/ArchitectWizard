<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Upcoming Projects</title>
    <style>
      :root {
        --bg: #eef5fb;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0a467d;
        --text: #163245;
        --muted: #647d8d;
        --border: #dfeaf5;
        --success: #0c7a61;
        --error: #c93d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #edf5fd 0%, #f9fbff 100%);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .panel {
        width: min(100%, 900px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(15, 46, 66, 0.08);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 28px 26px 22px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.5vw, 2.8rem);
      }

      .header p {
        margin: 12px 0 0;
        color: rgba(255,255,255,0.82);
        line-height: 1.5;
      }

      .content {
        padding: 24px 26px 28px;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: end;
        margin-bottom: 16px;
      }

      .field {
        flex: 1;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f8fbff;
        color: var(--text);
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-weight: 700;
        font-size: 1rem;
        padding: 13px 18px;
        cursor: pointer;
      }

      .status {
        min-height: 24px;
        margin: 0 0 16px;
        font-weight: 600;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        background: #f9fbff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.15rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Top 3 upcoming projects</h1>
        <p>View the next three projects for a county, including company and date range details.</p>
      </section>

      <div class="content">
        <div class="controls">
          <div class="field">
            <label for="countyInput">County</label>
            <input id="countyInput" type="text" value="Orange" placeholder="Orange" />
          </div>
          <button id="loadBtn" type="button">Load projects</button>
        </div>

        <p id="status" class="status success" aria-live="polite">Ready</p>

        <ul id="projectList" class="list"></ul>
      </div>
    </main>

    <script>
      const countyInput = document.getElementById('countyInput');
      const projectList = document.getElementById('projectList');
      const statusEl = document.getElementById('status');

      function setStatus(message, type = 'success') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        statusEl.classList.add(type);
      }

      function renderProjects(projects) {
        if (!projects || !projects.length) {
          projectList.innerHTML = '<li class="card"><h3>No upcoming projects</h3><div class="meta">This county has no projects in the current list.</div></li>';
          return;
        }

        projectList.innerHTML = projects.map((project) => {
          const start = project.startTime ? new Date(project.startTime).toLocaleDateString() : 'Unknown';
          const end = project.endTime ? new Date(project.endTime).toLocaleDateString() : 'Unknown';

          return `
            <li class="card">
              <h3>${project.title || 'Untitled project'}</h3>
              <div class="meta">
                <div><strong>Company:</strong> ${project.company || 'Unspecified'}</div>
                <div><strong>County:</strong> ${project.county || countyInput.value.trim()}</div>
                <div><strong>Start:</strong> ${start}</div>
                <div><strong>End:</strong> ${end}</div>
              </div>
            </li>
          `;
        }).join('');
      }

      async function loadTopProjects() {
        const county = countyInput.value.trim();
        if (!county) {
          setStatus('Please enter a county.', 'error');
          return;
        }

        try {
          setStatus(`Loading ${county} projects...`, 'success');
          const response = await fetch(`/api/projects/county/${encodeURIComponent(county)}`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Request failed.');
          }

          renderProjects(data.projects || []);
          setStatus(`${(data.projects || []).length} projects loaded.`, 'success');
        } catch (error) {
          console.error(error);
          projectList.innerHTML = '<li class="card"><h3>Unable to load projects</h3><div class="meta">Please check the county name and try again.</div></li>';
          setStatus(error.message || 'Project load failed.', 'error');
        }
      }

      document.getElementById('loadBtn').addEventListener('click', loadTopProjects);
      loadTopProjects();
    </script>
  </body>
</html>
