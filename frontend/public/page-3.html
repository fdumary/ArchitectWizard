<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Project Extraction</title>
    <style>
      :root {
        --bg: #f2f7fb;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0b487e;
        --text: #12324a;
        --muted: #5d7385;
        --border: #dfeaf4;
        --success: #0a7f5c;
        --error: #c93d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #edf5fd 0%, #f9fbff 100%);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .panel {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 45px rgba(17, 61, 89, 0.08);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 30px 28px 24px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.7vw, 2.8rem);
      }

      .header p {
        margin: 12px 0 0;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .body {
        padding: 28px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f8fbff;
        color: var(--text);
        font-size: 1rem;
        padding: 12px 14px;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        margin-bottom: 16px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: white;
        flex: 1;
      }

      .secondary {
        background: #edf4fb;
        color: var(--text);
      }

      .status {
        min-height: 24px;
        margin: 0 0 18px;
        font-weight: 600;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      pre {
        background: #f7fbff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Gemini extraction</h1>
        <p>Use the transcript from the previous step to extract the county, start date, and end date.</p>
      </section>

      <div class="body">
        <div class="field">
          <label for="apiKey">Gemini API key</label>
          <input id="apiKey" type="password" placeholder="Enter your Gemini API key" />
        </div>

        <div class="field">
          <label for="transcript">Transcript</label>
          <textarea id="transcript" placeholder="Paste the transcript or load it from local storage..."></textarea>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="processBtn">Extract project details</button>
          <button class="secondary" type="button" id="loadBtn">Load saved transcript</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="field">
          <label>Structured result</label>
          <pre id="resultOutput">{}</pre>
        </div>
      </div>
    </main>

    <script>
      const apiKeyInput = document.getElementById('apiKey');
      const transcriptInput = document.getElementById('transcript');
      const statusEl = document.getElementById('status');
      const resultOutput = document.getElementById('resultOutput');
      const STORAGE_KEY = 'elevenLabsTranscript';

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        if (type) {
          statusEl.classList.add(type);
        }
      }

      function loadSavedTranscript() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          transcriptInput.value = saved;
          setStatus('Saved transcript loaded.', 'success');
          return;
        }

        setStatus('No saved transcript was found. Paste one manually.', 'error');
      }

      function parseGeminiResponse(text) {
        const cleaned = text.trim();

        const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          return JSON.parse(jsonMatch[0]);
        }

        const object = {};
        const countyMatch = cleaned.match(/county\s*[:=]\s*['"]?([A-Za-z ]+)['"]?/i);
        const startMatch = cleaned.match(/start\s*(?:date|time)\s*[:=]\s*['"]?([^'"\n]+)['"]?/i);
        const endMatch = cleaned.match(/end\s*(?:date|time)\s*[:=]\s*['"]?([^'"\n]+)['"]?/i);

        if (countyMatch) object.county = countyMatch[1].trim();
        if (startMatch) object.startTime = startMatch[1].trim();
        if (endMatch) object.endTime = endMatch[1].trim();

        if (!object.county || !object.startTime || !object.endTime) {
          throw new Error('Gemini response was not valid JSON or did not include county, startTime, and endTime.');
        }

        return object;
      }

      async function processTranscript() {
        const apiKey = apiKeyInput.value.trim();
        const transcript = transcriptInput.value.trim();

        if (!apiKey) {
          setStatus('Please enter a Gemini API key.', 'error');
          return;
        }

        if (!transcript) {
          setStatus('Please provide a transcript to extract project details.', 'error');
          return;
        }

        const prompt = `Extract a JSON object with exactly this shape: {"county":"","startTime":"","endTime":""}. Use only Florida county names. Return only valid JSON with no markdown fences or explanation. Transcript: ${transcript}`;

        try {
          setStatus('Sending transcript to Gemini...', 'success');

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: prompt }]
              }]
            })
          });

          const data = await response.json();

          if (!response.ok) {
            const message = data?.error?.message || 'Gemini request failed.';
            throw new Error(message);
          }

          const generatedText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';

          if (!generatedText) {
            throw new Error('Gemini returned no content.');
          }

          const parsed = parseGeminiResponse(generatedText);
          resultOutput.textContent = JSON.stringify(parsed, null, 2);
          setStatus('Project details extracted successfully.', 'success');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Unable to extract project details.', 'error');
        }
      }

      document.getElementById('loadBtn').addEventListener('click', loadSavedTranscript);
      document.getElementById('processBtn').addEventListener('click', processTranscript);
    </script>
  </body>
</html>
