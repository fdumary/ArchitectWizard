<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conflict Review | Sperry Tech</title>
  <style>
    :root {
    --bg-dark: #150f28;
    --bg-panel: #1f1638;
    --card-bg: #2f2358;
    --primary: #7c4dff;
    --primary-dark: #5a32d6;
    --primary-soft: #3a2d66;
    --accent: #c9a227;
    --accent-soft: #3a2d52;
    --text: #ece3ff;
    --muted: #b3a4d9;
    --border: #4a3b7a;
    --success: #4fd6a8;
    --success-soft: #1f3a30;
    --warning: #e0a940;
    --warning-soft: #3a2f1a;
    --error: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 20px 44px;
    color: var(--text);
    font-family: 'IM Fell English', Georgia, serif;
    background: radial-gradient(circle at top, #2b1f4d 0%, #150f28 60%, #0d0a1a 100%);
  }

  .page { position: relative; z-index: 1; width: min(100%, 1100px); margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }

  .wizard-icon {
    width: 58px;
    height: 58px;
    object-fit: contain;
    flex: 0 0 auto;
    filter: drop-shadow(0 0 12px rgba(124, 77, 255, 0.5));
  }

  .eyebrow {
    margin: 0 0 5px;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1, h2, h3, p { margin-top: 0; }
  h1 {
    margin-bottom: 7px;
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 4vw, 2.7rem);
    color: var(--accent);
    text-shadow: 0 0 18px rgba(201, 162, 39, 0.4);
  }
  .intro { margin-bottom: 0; color: var(--muted); line-height: 1.55; }

  .panel {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--card-bg);
    box-shadow: 0 0 44px rgba(124, 77, 255, 0.25);
  }

  .status {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 22px;
    padding: 15px 17px;
    border-radius: 14px;
    background: var(--warning-soft);
    border: 1px solid rgba(224, 169, 64, 0.4);
    color: var(--warning);
    line-height: 1.5;
  }

  .status.success { background: var(--success-soft); border-color: rgba(79, 214, 168, 0.4); color: var(--success); }
  .status strong { display: block; margin-bottom: 3px; color: var(--text); }

  .comparison {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .project-card {
    min-width: 0;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--bg-panel);
  }

  .project-card.conflicting { border-color: rgba(224, 169, 64, 0.5); background: var(--warning-soft); }

  .project-label {
    display: inline-block;
    margin-bottom: 11px;
    padding: 6px 9px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--text);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .conflicting .project-label { background: rgba(224, 169, 64, 0.25); color: var(--warning); }
  .project-card h2 { margin-bottom: 17px; font-size: 1.35rem; overflow-wrap: anywhere; color: var(--text); }

  .details { display: grid; gap: 12px; margin: 0; }
  .detail { padding-bottom: 11px; border-bottom: 1px solid var(--border); }
  .detail:last-child { padding-bottom: 0; border-bottom: 0; }
  dt { margin-bottom: 4px; color: var(--muted); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  dd { margin: 0; line-height: 1.45; overflow-wrap: anywhere; color: var(--text); }

  .overlap {
    margin: 20px 0;
    padding: 18px;
    border: 1px solid rgba(224, 169, 64, 0.4);
    border-radius: 16px;
    background: var(--warning-soft);
  }

  .overlap h2, .recommendation h2 { margin-bottom: 9px; font-size: 1.15rem; }
  .overlap h2 { color: var(--warning); }
  .overlap p { margin-bottom: 0; line-height: 1.55; color: var(--text); }

  .recommendation {
    margin-top: 20px;
    padding: 19px;
    border: 1px solid rgba(79, 214, 168, 0.4);
    border-radius: 16px;
    background: var(--success-soft);
  }

  .recommendation h2 { color: var(--success); }
  .recommendation p { margin-bottom: 0; line-height: 1.55; color: var(--text); }

  .empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 16px;
    background: var(--bg-panel);
    line-height: 1.6;
  }

  .navigation { margin-top: 22px; text-align: center; font-size: 0.9rem; }
  .navigation a { color: var(--accent); }
  .navigation a:hover { color: var(--text); }

  @media (max-width: 700px) {
    body { padding: 20px 14px 32px; }
    .panel { padding: 18px; }
    .comparison { grid-template-columns: 1fr; }
    .topbar { align-items: flex-start; }
  }

  .sparkle-field {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .sparkle-field::before,
  .sparkle-field::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(3px 3px at 20px 30px, var(--accent), transparent),
      radial-gradient(4px 4px at 160px 120px, var(--text), transparent),
      radial-gradient(2px 2px at 90px 200px, var(--accent), transparent),
      radial-gradient(3px 3px at 280px 60px, var(--text), transparent),
      radial-gradient(4px 4px at 340px 220px, var(--accent), transparent),
      radial-gradient(2px 2px at 420px 140px, var(--text), transparent),
      radial-gradient(3px 3px at 60px 320px, var(--accent), transparent),
      radial-gradient(4px 4px at 500px 90px, var(--text), transparent),
      radial-gradient(3px 3px at 130px 380px, var(--accent), transparent),
      radial-gradient(2px 2px at 240px 340px, var(--text), transparent);
    background-repeat: repeat;
    background-size: 300px 220px;
    animation: sparkle-drift 60s linear infinite, sparkle-twinkle 3s ease-in-out infinite alternate;
    opacity: 0.85;
  }

  .sparkle-field::after {
    background-size: 380px 280px;
    animation-duration: 90s, 4s;
    animation-delay: 0s, 1.5s;
    opacity: 0.55;
  }

  @keyframes sparkle-drift {
    from { transform: translateY(0); }
    to { transform: translateY(-400px); }
  }

  @keyframes sparkle-twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
  }

  .plus-sparkle {
    position: fixed;
    width: 20px;
    height: 20px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.9;
    animation: plus-twinkle 2.5s ease-in-out infinite alternate;
  }

  .plus-sparkle::before,
  .plus-sparkle::after {
    content: '';
    position: absolute;
    background: var(--accent);
    box-shadow: 0 0 12px 2px var(--accent), 0 0 24px 4px rgba(124, 77, 255, 0.6);
    border-radius: 2px;
  }

  .plus-sparkle::before {
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;
    transform: translateY(-50%);
  }

  .plus-sparkle::after {
    left: 50%;
    top: 0;
    width: 4px;
    height: 100%;
    transform: translateX(-50%);
  }

  @keyframes plus-twinkle {
    from { opacity: 0.4; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.15); }
  }
  </style>
</head>
<body>
  <div class="sparkle-field" aria-hidden="true"></div>
  <div class="plus-sparkle" style="top: 10%; left: 6%;" aria-hidden="true"></div>
  <div class="plus-sparkle" style="top: 18%; left: 92%; animation-delay: 0.5s;" aria-hidden="true"></div>
  <div class="plus-sparkle" style="top: 80%; left: 4%; animation-delay: 1s;" aria-hidden="true"></div>
  <div class="plus-sparkle" style="top: 88%; left: 90%; animation-delay: 1.5s;" aria-hidden="true"></div>
  <main class="page">
  <main class="page">
    <header class="topbar">
      <img class="wizard-icon" src="assets/wizard icon.png" alt="Wizard hat" />
      <div>
        <p class="eyebrow">Wizard conflict review</p>
        <h1>Here is what overlaps</h1>
        <p class="intro">The wizard has compared the project dates and found the details that need attention.</p>
      </div>
    </header>

    <section class="panel">
      <div id="status" class="status" aria-live="polite">
        <div><strong>The wizard says:</strong><span id="statusMessage">Reviewing the project timelines...</span></div>
      </div>
      <div id="content"></div>
      <nav class="navigation"><a href="intake.html">Back to intake</a> &nbsp;|&nbsp; <a href="map.html">County map</a> &nbsp;|&nbsp; <a href="index.html">Start</a></nav>
    </section>
  </main>

  <script>
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    const statusMessage = document.getElementById('statusMessage');
    const query = new URLSearchParams(window.location.search);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[character]);
    }

    function dateValue(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function dateText(value) {
      const date = dateValue(value);
      return date ? date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'Not provided';
    }

    function timeText(value) {
      const date = dateValue(value);
      return date ? date.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Not provided';
    }

    function projectCard(project, label, className) {
      return `<article class="project-card ${className}">
        <span class="project-label">${escapeHtml(label)}</span>
        <h2>${escapeHtml(project.title || 'Untitled project')}</h2>
        <dl class="details">
          <div class="detail"><dt>Company</dt><dd>${escapeHtml(project.company || 'Unspecified')}</dd></div>
          <div class="detail"><dt>County</dt><dd>${escapeHtml(project.county || 'Not provided')}</dd></div>
          <div class="detail"><dt>Starts</dt><dd>${timeText(project.startTime)}</dd></div>
          <div class="detail"><dt>Ends</dt><dd>${timeText(project.endTime)}</dd></div>
          <div class="detail"><dt>Description</dt><dd>${escapeHtml(project.description || 'No description provided.')}</dd></div>
        </dl>
      </article>`;
    }

    function overlapWindow(first, second) {
      const start = new Date(Math.max(dateValue(first.startTime)?.getTime() || 0, dateValue(second.startTime)?.getTime() || 0));
      const end = new Date(Math.min(dateValue(first.endTime)?.getTime() || 0, dateValue(second.endTime)?.getTime() || 0));
      return { start, end };
    }

    function dayAfter(date) {
      const next = new Date(date);
      next.setDate(next.getDate() + 1);
      return next;
    }

    function dayBefore(date) {
      const previous = new Date(date);
      previous.setDate(previous.getDate() - 1);
      return previous;
    }

    function recommendation(current, conflicts) {
      const currentStart = dateValue(current.startTime);
      const currentEnd = dateValue(current.endTime);
      if (!currentStart || !currentEnd || !conflicts.length) return 'Review the timelines with the project coordinator before confirming a new schedule.';

      const sorted = conflicts
        .map((project) => ({ start: dateValue(project.startTime), end: dateValue(project.endTime) }))
        .filter((period) => period.start && period.end)
        .sort((a, b) => a.start - b.start);

      const before = dayBefore(sorted[0].start);
      if (before >= currentStart) {
        return `The nearest open option begins on ${dateText(currentStart)} and ends on ${dateText(before)}. Moving the project before the conflict may keep the work window intact.`;
      }

      const after = dayAfter(sorted[sorted.length - 1].end);
      const duration = Math.max(0, currentEnd - currentStart);
      const suggestedEnd = new Date(after.getTime() + duration);
      return `The nearest suggested option begins on ${dateText(after)} and runs through ${dateText(suggestedEnd)}. Moving the project after the conflicting work is the clearest way to avoid the overlap.`;
    }

    function render(data) {
      const conflicts = Array.isArray(data.conflicts) ? data.conflicts : [];
      const current = {
        title: data.title || 'New project',
        description: data.description || 'Project submitted for conflict review.',
        county: data.county,
        startTime: data.startTime,
        endTime: data.endTime,
        company: data.company || 'Your company'
      };

      if (!conflicts.length) {
        status.classList.add('success');
        statusMessage.textContent = 'No conflicting project was found for this time window.';
        content.innerHTML = '<div class="empty">The wizard found a clear path. No existing project overlaps these dates and this county.</div>';
        return;
      }

      statusMessage.textContent = `${conflicts.length} existing project${conflicts.length === 1 ? '' : 's'} overlap${conflicts.length === 1 ? 's' : ''} this time window.`;
      const firstConflict = conflicts[0];
      const overlap = overlapWindow(current, firstConflict);

      content.innerHTML = `<div class="comparison">
        ${projectCard(current, 'Your project', '')}
        ${projectCard(firstConflict, 'Conflicting project', 'conflicting')}
      </div>
      <section class="overlap">
        <h2>Conflicting time point</h2>
        <p>The schedules overlap from <strong>${timeText(overlap.start)}</strong> through <strong>${timeText(overlap.end)}</strong> in ${escapeHtml(data.county || firstConflict.county || 'the selected county')}.</p>
      </section>
      <section class="recommendation">
        <h2>The wizard recommends</h2>
        <p>${escapeHtml(recommendation(current, conflicts))}</p>
      </section>`;
    }

    async function loadConflict() {
      const payload = {
        title: query.get('title') || '',
        description: query.get('description') || '',
        county: query.get('county') || '',
        startTime: query.get('startTime') || '',
        endTime: query.get('endTime') || ''
      };

      if (!payload.county || !payload.startTime || !payload.endTime) {
        statusMessage.textContent = 'Add county, start time, and end time to review a project conflict.';
        content.innerHTML = '<div class="empty">No conflict details were supplied yet. Submit a project for review, then open this page with its project details.</div>';
        return;
      }

      try {
        const response = await fetch(`/api/projects/conflicts?county=${encodeURIComponent(payload.county)}&startTime=${encodeURIComponent(payload.startTime)}&endTime=${encodeURIComponent(payload.endTime)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Conflict review failed.');
        render({ ...payload, ...result });
      } catch (error) {
        statusMessage.textContent = error.message || 'The wizard could not load the conflict details.';
        content.innerHTML = '<div class="empty">Please return to intake and try the conflict check again.</div>';
      }
    }

    loadConflict();
  </script>
</body>
</html>
