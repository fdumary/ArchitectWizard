<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conflict Feedback</title>
    <style>
      :root {
        --bg: #f1f6fb;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0a467d;
        --text: #183246;
        --muted: #627c8c;
        --border: #dfeaf5;
        --success: #0f7d5d;
        --warning: #c87818;
        --error: #c93d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #edf5fd 0%, #f9fbff 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(18, 46, 68, 0.09);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 28px 26px 22px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.7vw, 2.8rem);
      }

      .header p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.5;
      }

      .body {
        padding: 28px 26px 30px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fbfe;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 8px 0 14px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: white;
        flex: 1;
      }

      .secondary {
        background: #edf4fb;
        color: var(--text);
      }

      .status {
        min-height: 28px;
        margin: 0 0 18px;
        font-weight: 600;
      }

      .status.success { color: var(--success); }
      .status.warning { color: var(--warning); }
      .status.error { color: var(--error); }

      .result-box {
        background: #f8fbff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 16px;
        line-height: 1.6;
      }

      .result-box strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Conflict check</h1>
        <p>Review the extracted project details against the project conflict API and show whether this project overlaps existing work.</p>
      </section>

      <div class="body">
        <div class="field">
          <label for="county">County</label>
          <input id="county" type="text" placeholder="Orange" />
        </div>

        <div class="field">
          <label for="startTime">Start date</label>
          <input id="startTime" type="date" />
        </div>

        <div class="field">
          <label for="endTime">End date</label>
          <input id="endTime" type="date" />
        </div>

        <div class="actions">
          <button class="primary" id="checkBtn" type="button">Check conflicts</button>
          <button class="secondary" id="loadBtn" type="button">Load saved result</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="result-box" id="resultBox">
          <strong>No conflict check run yet.</strong>
          Enter your project data and click the button to review overlap risk.
        </div>
      </div>
    </main>

    <script>
      const countyInput = document.getElementById('county');
      const startInput = document.getElementById('startTime');
      const endInput = document.getElementById('endTime');
      const statusEl = document.getElementById('status');
      const resultBox = document.getElementById('resultBox');
      const STORAGE_KEY = 'conflictCheckResult';

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        if (type) {
          statusEl.classList.add(type);
        }
      }

      function loadSavedResult() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          setStatus('No saved conflict result was found.', 'warning');
          return;
        }

        try {
          const result = JSON.parse(saved);
          renderResult(result);
          setStatus('Saved conflict result loaded.', 'success');
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
          setStatus('The saved result was invalid and was cleared.', 'error');
        }
      }

      function renderResult(result) {
        const conflicts = Array.isArray(result.conflicts) ? result.conflicts : [];
        const county = result.county || countyInput.value || 'Unknown county';

        if (!conflicts.length) {
          resultBox.innerHTML = `
            <strong>No conflicts found.</strong>
            <div>${county} is clear for the selected date range.</div>
          `;
          return;
        }

        resultBox.innerHTML = `
          <strong>Conflict detected.</strong>
          <div>This project overlaps ${conflicts.length} existing project(s) in ${county}.</div>
          <ul>
            ${conflicts.map((project) => `
              <li>
                ${project.title || 'Untitled project'} — ${project.startTime ? new Date(project.startTime).toLocaleDateString() : 'unknown start'} to ${project.endTime ? new Date(project.endTime).toLocaleDateString() : 'unknown end'}
              </li>
            `).join('')}
          </ul>
        `;
      }

      async function checkConflicts() {
        const county = countyInput.value.trim();
        const startTime = startInput.value;
        const endTime = endInput.value;

        if (!county || !startTime || !endTime) {
          setStatus('Please fill in the county, start date, and end date.', 'error');
          return;
        }

        const query = new URLSearchParams({
          county,
          startTime: new Date(startTime).toISOString(),
          endTime: new Date(endTime).toISOString()
        });

        try {
          setStatus('Checking project overlap...', 'success');

          const response = await fetch(`/api/projects/conflicts?${query.toString()}`);
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || 'Conflict check failed.');
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
          renderResult(result);
          setStatus(result.conflictCount > 0 ? 'Conflicts detected for this project.' : 'No conflicts found.', result.conflictCount > 0 ? 'warning' : 'success');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'Unable to check conflicts.', 'error');
        }
      }

      document.getElementById('checkBtn').addEventListener('click', checkConflicts);
      document.getElementById('loadBtn').addEventListener('click', loadSavedResult);
    </script>
  </body>
</html>
