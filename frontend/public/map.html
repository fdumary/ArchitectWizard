<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florida County Map</title>
    <style>
      :root {
        --bg: #ebf7ff;
        --panel: #f9fbff;
        --primary: #1b4fbd;
        --primary-dark: #112f76;
        --accent: #22c7cf;
        --text: #16314a;
        --muted: #5b7690;
        --border: #d4e3f3;
        --success: #0d8b71;
        --warning: #d88b28;
        --error: #c63d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #f5fbff 0%, #dfeeff 28%, #d3ebff 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 1000px);
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(18, 47, 118, 0.12);
        border-radius: 24px;
        box-shadow: 0 18px 42px rgba(15, 41, 87, 0.12);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 42%, var(--accent) 100%);
        color: white;
        padding: 30px 28px 22px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.5vw, 2.7rem);
        letter-spacing: 0.02em;
      }

      .header p {
        margin: 12px 0 0;
        color: rgba(255,255,255,0.86);
        line-height: 1.5;
      }

      .content {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
        padding: 24px;
        background: linear-gradient(180deg, #ffffff 0%, #f5f9ff 100%);
      }

      .map-wrap {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(180deg, #f9fbff 0%, #edf6ff 100%);
        padding: 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
      }

      .county {
        fill: #dfeef9;
        stroke: #5e82ad;
        stroke-width: 2;
        cursor: pointer;
        transition: fill 0.2s ease, transform 0.2s ease, filter 0.2s ease;
      }

      .county:hover {
        fill: #cee1f5;
        filter: brightness(1.02);
      }

      .county.selected {
        fill: #b9d5f5;
        stroke: var(--primary-dark);
      }

      .sidebar {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(180deg, #f9fcff 0%, #edf6ff 100%);
        padding: 18px;
      }

      .sidebar h2 {
        margin: 0 0 14px;
        font-size: 1.5rem;
      }

      .status {
        min-height: 28px;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      li {
        margin-bottom: 8px;
        line-height: 1.4;
        background: rgba(255,255,255,0.65);
        border: 1px solid rgba(214,227,244,0.9);
        border-radius: 10px;
        padding: 8px 10px;
      }

      @media (max-width: 780px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>

        <p>Choose a county to view the upcoming project list and spot nearby scheduling risks.</p>

        </div>

        <aside class="sidebar">
          <h2 id="countyTitle">Select a county</h2>
          <p style="font-size:0.85rem;color:#627d8b;">← <a href="onboarding.html">Start</a> | <a href="intake.html">Intake wizard</a></p>
          <p id="status" class="status" aria-live="polite">Ready</p>
          <ul id="projectList">
            <li>Click a county to load the top 3 upcoming projects.</li>
          </ul>
        </aside>
      </div>
    </main>

    <script>
      const countyTitle = document.getElementById('countyTitle');
      const projectList = document.getElementById('projectList');
      const statusEl = document.getElementById('status');

      function setStatus(message, type = 'success') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        statusEl.classList.add(type);
      }

      function renderProjects(county, projects) {
        countyTitle.textContent = county;

        if (!projects || !projects.length) {
          projectList.innerHTML = '<li>No upcoming projects found for this county.</li>';
          return;
        }

        projectList.innerHTML = projects
          .map((project) => {
            const start = project.startTime ? new Date(project.startTime).toLocaleDateString() : 'Unknown';
            const end = project.endTime ? new Date(project.endTime).toLocaleDateString() : 'Unknown';
            return `
              <li>
                <strong>${project.title || 'Untitled project'}</strong><br />
                ${project.company || 'Unspecified company'}<br />
                ${start} to ${end}
              </li>
            `;
          })
          .join('');
      }

      async function fetchCountyProjects(county) {
        setStatus(`Loading ${county}...`, 'success');

        try {
          const response = await fetch(`/api/projects/county/${encodeURIComponent(county)}`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Failed to load county projects.');
          }

          renderProjects(county, data.projects || []);
          setStatus('Projects loaded.', 'success');
        } catch (error) {
          console.error(error);
          projectList.innerHTML = '<li>Unable to load county projects.</li>';
          setStatus(error.message || 'Project load failed.', 'error');
        }
      }

      document.querySelectorAll('.county').forEach((countyElement) => {
        countyElement.addEventListener('click', () => {
          document.querySelectorAll('.county').forEach((el) => el.classList.remove('selected'));
          countyElement.classList.add('selected');
          const county = countyElement.dataset.county;
          fetchCountyProjects(county);
        });
      });
    </script>
  </body>
</html>
