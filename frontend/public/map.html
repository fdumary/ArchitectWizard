<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florida County Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --bg: #ebf7ff;
        --panel: #f9fbff;
        --primary: #1b4fbd;
        --primary-dark: #112f76;
        --accent: #22c7cf;
        --text: #16314a;
        --muted: #5b7690;
        --border: #d4e3f3;
        --success: #0d8b71;
        --warning: #d88b28;
        --error: #c63d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #f5fbff 0%, #dfeeff 28%, #d3ebff 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 1000px);
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(18, 47, 118, 0.12);
        border-radius: 24px;
        box-shadow: 0 18px 42px rgba(15, 41, 87, 0.12);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 42%, var(--accent) 100%);
        color: white;
        padding: 30px 28px 22px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.5vw, 2.7rem);
        letter-spacing: 0.02em;
      }

      .header p {
        margin: 12px 0 0;
        color: rgba(255,255,255,0.86);
        line-height: 1.5;
      }

      .content {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
        padding: 24px;
        background: linear-gradient(180deg, #ffffff 0%, #f5f9ff 100%);
      }

      .map-wrap {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(180deg, #f9fbff 0%, #edf6ff 100%);
        padding: 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      }

      #map {
        height: 560px;
        border-radius: 12px;
      }

      .sidebar {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(180deg, #f9fcff 0%, #edf6ff 100%);
        padding: 18px;
      }

      .sidebar h2 {
        margin: 0 0 14px;
        font-size: 1.5rem;
      }

      .status {
        min-height: 28px;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      li {
        margin-bottom: 8px;
        line-height: 1.4;
        background: rgba(255,255,255,0.65);
        border: 1px solid rgba(214,227,244,0.9);
        border-radius: 10px;
        padding: 8px 10px;
      }

      @media (max-width: 780px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Florida county map</h1>
        <p>Choose a county to view the upcoming project list and spot nearby scheduling risks.</p>
      </section>

      <div class="content">
        <div class="map-wrap">
          <div id="map"></div>
        </div>

        <aside class="sidebar">
          <h2 id="countyTitle">Select a county</h2>
          <p id="status" class="status" aria-live="polite">Ready</p>
          <ul id="projectList">
            <li>Click a county to load the top 3 upcoming projects.</li>
          </ul>
        </aside>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
  </body>
</html>
