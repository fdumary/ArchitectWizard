<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Intake</title>
    <style>
      :root {
        --bg: #f4f8fd;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0a467d;
        --accent: #ffd166;
        --text: #1b2d3d;
        --muted: #5a7285;
        --border: #dfeaf5;
        --success: #0e7f5d;
        --error: #bf2d2d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef5fb 0%, #f7fbff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        padding: 24px;
      }

      .panel {
        width: min(100%, 720px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(17, 45, 61, 0.08);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 28px 30px 24px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .header p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.5;
      }

      .body {
        padding: 28px 30px 30px;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        background: #f9fbfe;
        color: var(--text);
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(13, 94, 168, 0.5);
        box-shadow: 0 0 0 4px rgba(13, 94, 168, 0.08);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--primary);
        color: #fff;
      }

      .secondary {
        background: #edf4fb;
        color: var(--text);
      }

      .status {
        min-height: 24px;
        margin: 0 0 18px;
        font-weight: 600;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      @media (max-width: 560px) {
        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Audio to transcript</h1>
        <p>Record a short project description and submit it to Eleven Labs to turn it into text.</p>
      </section>

      <div class="body">
        <div class="field">
          <label for="apiKey">Eleven Labs API key</label>
          <input id="apiKey" type="password" placeholder="Enter your XI API key" />
        </div>

        <div class="actions">
          <button id="recordBtn" class="btn primary" type="button">Start recording</button>
          <button id="submitBtn" class="btn secondary" type="button">Submit audio</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="field">
          <label for="transcriptOutput">Transcript</label>
          <textarea id="transcriptOutput" placeholder="Your transcript will appear here..." readonly></textarea>
        </div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const recordBtn = document.getElementById('recordBtn');
      const submitBtn = document.getElementById('submitBtn');
      const apiKeyInput = document.getElementById('apiKey');
      const transcriptOutput = document.getElementById('transcriptOutput');

      let mediaRecorder;
      let audioChunks = [];
      let audioBlob = null;

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        if (type) {
          statusEl.classList.add(type);
        }
      }

      function getApiKey() {
        return (apiKeyInput.value || '').trim();
      }

      async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus('This browser does not support audio recording.', 'error');
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          audioBlob = null;

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            setStatus('Recording complete. You can submit the audio.', 'success');
          };

          mediaRecorder.start();
          recordBtn.textContent = 'Stop recording';
          setStatus('Recording in progress. Speak naturally for 10-20 seconds.', 'success');

          recordBtn.onclick = stopRecording;
        } catch (error) {
          console.error(error);
          setStatus('Microphone access was denied. Please allow it and try again.', 'error');
        }
      }

      function stopRecording() {
        if (!mediaRecorder) {
          return;
        }

        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach((track) => track.stop());
        recordBtn.textContent = 'Start recording';
        recordBtn.onclick = startRecording;
      }

      async function submitToElevenLabs() {
        const apiKey = getApiKey();
        if (!apiKey) {
          setStatus('Please add your Eleven Labs API key before submitting.', 'error');
          return;
        }

        if (!audioBlob) {
          setStatus('Please record audio before submitting it.', 'error');
          return;
        }

        try {
          setStatus('Sending audio to Eleven Labs...', 'success');

          const endpoints = [
            'https://api.elevenlabs.io/v1/speech-to-text',
            'https://api.elevenlabs.io/v1/audio/transcriptions'
          ];

          let transcript = '';

          for (const endpoint of endpoints) {
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.webm');
            formData.append('model_id', 'scribe_v1');

            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'xi-api-key': apiKey
              },
              body: formData
            });

            if (!response.ok) {
              const errorText = await response.text();
              console.error('Eleven Labs error', endpoint, response.status, errorText);
              continue;
            }

            const data = await response.json();
            transcript = data.text || data.transcript || data.output || data.result?.text || '';

            if (transcript) {
              break;
            }
          }

          if (!transcript) {
            throw new Error('No transcript returned from the API.');
          }

          transcriptOutput.value = transcript;
          setStatus('Transcript received successfully.', 'success');
        } catch (error) {
          console.error(error);
          setStatus('The transcription request failed. Check your API key and try again.', 'error');
        }
      }

      recordBtn.onclick = startRecording;
      submitBtn.onclick = submitToElevenLabs;
    </script>
  </body>
</html>
