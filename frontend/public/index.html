<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Intake Wizard</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --panel: #ffffff;
        --primary: #0f4c81;
        --primary-dark: #0b355d;
        --accent: #f8b229;
        --text: #11263d;
        --muted: #5a6f85;
        --border: #dfeaf4;
        --success: #0d8a63;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef5fb 0%, #f8fbff 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .wizard-card {
        width: min(100%, 620px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 45px rgba(17, 38, 61, 0.08);
        overflow: hidden;
      }

      .hero {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 28px 28px 20px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.4rem);
      }

      .hero p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.84);
        line-height: 1.5;
      }

      form {
        padding: 28px;
      }

      .field {
        margin-bottom: 22px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #f9fbfd;
        color: var(--text);
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: rgba(15, 76, 129, 0.55);
        box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.08);
      }

      .voice-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .voice-button,
      .primary-button,
      .secondary-button {
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .voice-button:hover,
      .primary-button:hover,
      .secondary-button:hover {
        transform: translateY(-1px);
      }

      .voice-button {
        background: #eff7ff;
        color: var(--primary);
        border: 1px solid #cfe3f7;
        padding: 10px 14px;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      .primary-button {
        flex: 1;
        background: var(--primary);
        color: white;
        padding: 14px 18px;
      }

      .secondary-button {
        background: #edf3f8;
        color: var(--text);
        padding: 14px 18px;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        font-size: 0.96rem;
        font-weight: 600;
      }

      .status.success {
        color: var(--success);
      }

      .status.error {
        color: var(--error);
      }

      @media (max-width: 540px) {
        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="wizard-card">
      <section class="hero">
        <h1>Project intake</h1>
        <p>Capture the project details and save them locally so the next stage can check for conflicts.</p>
      </section>

      <form id="projectWizard" novalidate>
        <div class="field">
          <label for="projectName">Project name</label>
          <input id="projectName" name="projectName" type="text" placeholder="Example: Lakeview Utility Upgrade" autocomplete="off" />
          <div class="voice-row">
            <button type="button" class="voice-button" id="voiceButton">Use voice input</button>
          </div>
        </div>

        <div class="field">
          <label for="startDate">Start date</label>
          <input id="startDate" name="startDate" type="date" />
        </div>

        <div class="field">
          <label for="endDate">End date</label>
          <input id="endDate" name="endDate" type="date" />
        </div>

        <div class="actions">
          <button type="submit" class="primary-button">Save details</button>
          <button type="button" class="secondary-button" id="clearButton">Clear</button>
        </div>

        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const STORAGE_KEY = 'constructionProjectWizard';
      const form = document.getElementById('projectWizard');
      const projectNameInput = document.getElementById('projectName');
      const startDateInput = document.getElementById('startDate');
      const endDateInput = document.getElementById('endDate');
      const statusElement = document.getElementById('status');

      function setStatus(message, type = '') {
        statusElement.textContent = message;
        statusElement.className = 'status';
        if (type) {
          statusElement.classList.add(type);
        }
      }

      function readSavedProject() {
        const rawValue = localStorage.getItem(STORAGE_KEY);
        if (!rawValue) {
          return null;
        }

        try {
          return JSON.parse(rawValue);
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }
      }

      function hydrateForm() {
        const project = readSavedProject();
        if (!project) {
          return;
        }

        projectNameInput.value = project.projectName || '';
        startDateInput.value = project.startDate || '';
        endDateInput.value = project.endDate || '';
      }

      function saveDraft() {
        const project = {
          projectName: projectNameInput.value.trim(),
          startDate: startDateInput.value,
          endDate: endDateInput.value
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
      }

      function validateProject() {
        if (!projectNameInput.value.trim()) {
          return 'Please enter a project name.';
        }

        if (!startDateInput.value) {
          return 'Please select a start date.';
        }

        if (!endDateInput.value) {
          return 'Please select an end date.';
        }

        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);

        if (Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) {
          return 'Please provide valid dates.';
        }

        if (endDate < startDate) {
          return 'End date must be the same day or later than the start date.';
        }

        return '';
      }

      [projectNameInput, startDateInput, endDateInput].forEach((field) => {
        field.addEventListener('input', () => {
          saveDraft();
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const validationMessage = validateProject();
        if (validationMessage) {
          setStatus(validationMessage, 'error');
          return;
        }

        const payload = {
          title: projectNameInput.value.trim(),
          description: '',
          county: 'Orange',
          startTime: new Date(startDateInput.value).toISOString(),
          endTime: new Date(endDateInput.value).toISOString(),
          company: 'Unspecified'
        };

        try {
          const response = await fetch('/api/projects', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || 'Failed to save project details.');
          }

          saveDraft();
          setStatus('Project details saved successfully.', 'success');
        } catch (error) {
          setStatus(error.message || 'Unable to save project details.', 'error');
        }
      });

      document.getElementById('clearButton').addEventListener('click', () => {
        form.reset();
        localStorage.removeItem(STORAGE_KEY);
        setStatus('Draft cleared. You can start again.', 'success');
      });

      document.getElementById('voiceButton').addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          setStatus('Voice input is not supported in this browser.', 'error');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = false;

        setStatus('Listening for the project name...', 'success');

        recognition.onresult = (event) => {
          const transcript = Array.from(event.results)
            .map((result) => result[0].transcript)
            .join(' ')
            .trim();

          if (transcript) {
            projectNameInput.value = transcript;
            saveDraft();
            setStatus('Project name captured from voice input.', 'success');
          }
        };

        recognition.onerror = () => {
          setStatus('Voice input could not be captured. Please type the project name manually.', 'error');
        };

        recognition.start();
      });

      hydrateForm();
    </script>
  </body>
</html>
