<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend API Wiring</title>
    <style>
      :root {
        --bg: #eef5fb;
        --panel: #ffffff;
        --primary: #0d5ea8;
        --primary-dark: #0a467d;
        --text: #183247;
        --muted: #627d8d;
        --border: #dfeaf4;
        --success: #0d7a60;
        --error: #c93d3d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #edf5fd 0%, #f9fbff 100%);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .panel {
        width: min(100%, 880px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(17, 42, 63, 0.08);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 28px 24px 22px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 2.7vw, 2.7rem);
      }

      .header p {
        margin: 10px 0 0;
        color: rgba(255,255,255,0.82);
        line-height: 1.5;
      }

      .body {
        padding: 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
      }

      label {
        margin-bottom: 8px;
        font-weight: 700;
      }

      input {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fbff;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: white;
      }

      .secondary {
        background: #edf4fb;
        color: var(--text);
      }

      .status {
        min-height: 28px;
        margin: 0 0 20px;
        font-weight: 700;
      }

      .status.success { color: var(--success); }
      .status.error { color: var(--error); }

      .response {
        background: #f8fbff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="header">
        <h1>Frontend → backend API wiring</h1>
        <p>Use the Express routes for the project create and conflict lookup flow.</p>
      </section>

      <div class="body">
        <div class="form-grid">
          <div class="field">
            <label for="title">Project title</label>
            <input id="title" value="Harbor View Expansion" />
          </div>

          <div class="field">
            <label for="county">County</label>
            <input id="county" value="Orange" />
          </div>

          <div class="field">
            <label for="startTime">Start date</label>
            <input id="startTime" type="date" value="2026-10-01" />
          </div>

          <div class="field">
            <label for="endTime">End date</label>
            <input id="endTime" type="date" value="2026-10-15" />
          </div>
        </div>

        <div class="actions">
          <button id="createBtn" class="primary" type="button">Create project</button>
          <button id="checkBtn" class="secondary" type="button">Check conflicts</button>
        </div>

        <p id="status" class="status success" aria-live="polite">Ready</p>
        <pre id="response" class="response">No request sent yet.</pre>
      </div>
    </main>

    <script>
      const titleInput = document.getElementById('title');
      const countyInput = document.getElementById('county');
      const startInput = document.getElementById('startTime');
      const endInput = document.getElementById('endTime');
      const statusEl = document.getElementById('status');
      const responseEl = document.getElementById('response');

      function setStatus(message, type = 'success') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        statusEl.classList.add(type);
      }

      function renderResponse(data) {
        responseEl.textContent = JSON.stringify(data, null, 2);
      }

      async function createProject() {
        const payload = {
          title: titleInput.value.trim(),
          description: 'Frontend wiring validation project',
          county: countyInput.value.trim(),
          startTime: new Date(startInput.value).toISOString(),
          endTime: new Date(endInput.value).toISOString(),
          company: 'Frontend Harness'
        };

        try {
          setStatus('Creating project via /api/projects...', 'success');
          const response = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || 'Create failed.');
          }

          renderResponse(result);
          setStatus('Project creation succeeded.', 'success');
        } catch (error) {
          console.error(error);
          renderResponse({ error: error.message || 'Create failed.' });
          setStatus(error.message || 'Create failed.', 'error');
        }
      }

      async function checkConflicts() {
        const params = new URLSearchParams({
          county: countyInput.value.trim(),
          startTime: new Date(startInput.value).toISOString(),
          endTime: new Date(endInput.value).toISOString()
        });

        try {
          setStatus('Checking conflicts via /api/projects/conflicts...', 'success');
          const response = await fetch(`/api/projects/conflicts?${params.toString()}`);
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || 'Conflict lookup failed.');
          }

          renderResponse(result);
          setStatus('Conflict check succeeded.', 'success');
        } catch (error) {
          console.error(error);
          renderResponse({ error: error.message || 'Conflict lookup failed.' });
          setStatus(error.message || 'Conflict lookup failed.', 'error');
        }
      }

      document.getElementById('createBtn').addEventListener('click', createProject);
      document.getElementById('checkBtn').addEventListener('click', checkConflicts);
    </script>
  </body>
</html>
