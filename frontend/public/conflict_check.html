<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conflict Check</title>
<style>
:root{--bg:#edf5fb;--panel:#fff;--primary:#1b4fbd;--primary-dark:#112f76;--accent:#21c7cf;--text:#183246;--border:#dfeaf5;--success:#0d7d61;--error:#c63d3d;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top, #f4fbff 0%, #dfeeff 28%, #d8ebff 100%);font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:min(100%,720px);background:linear-gradient(180deg,#fff 0%,#f4f9ff 100%);border:1px solid rgba(17,47,118,0.1);border-radius:24px;padding:28px;box-shadow:0 20px 44px rgba(17,42,63,0.08);}
.header-pill{display:inline-block;margin-bottom:12px;padding:7px 12px;border-radius:999px;background:rgba(27,79,189,0.08);border:1px solid rgba(27,79,189,0.12);color:var(--primary-dark);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
h1{margin:0 0 8px;font-size:1.9rem;color:var(--primary-dark);}
p{color:#627d8b;margin:0 0 18px;line-height:1.6;}
textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:1rem;resize:vertical;background:#f9fbff;color:var(--text);}
button{background:linear-gradient(135deg,var(--primary) 0%, var(--accent) 100%);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:0 10px 18px rgba(28,77,189,0.2);}
.status{min-height:24px;margin-top:14px;font-weight:700;}
.success{color:var(--success);}
.error{color:var(--error);}
.result{margin-top:16px;padding:14px;background:#f9fbfd;border:1px solid var(--border);border-radius:12px;line-height:1.4;}
</style>
</head>
<body>
<main class="card">
  <span class="header-pill">Guide check</span>
  <h1>Project conflict check</h1>
  <form id="conflictForm" novalidate style="display:none;"></form>
  <p id="status" class="status" aria-live="polite"></p>
  <div id="result" class="result" style="display:none;"></div>
  <p style="text-align:center;margin-top:14px;color:#627d8b;font-size:0.9rem;">← <a href="intake.html">Back to intake</a> | <a href="map.html">County map</a> | <a href="onboarding.html">Start</a></p>
</main>
<script src="wizard-voice.js"></script>
<script>
function fmtUTC(dateStr) {
  if (!dateStr) return 'N/A';
  const d = new Date(dateStr);
  return `${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

const form = document.getElementById('conflictForm');
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  function setStatus(msg, type=''){
    status.textContent = msg;
    status.className = 'status';
    if(type) status.classList.add(type);
  }

  function speakWizardConflict() {
    const conflicts = result.querySelectorAll('li');
    const count = conflicts.length;
    let msg = 'The conflict check is complete.';
    if (count > 0) msg += ' I see ' + count + ' overlapping timelines. Study them well, and consider the nearest window for your work.';
    else msg += ' No clashes found. You are clear to proceed.';
    speakWizard(msg);
  }

  // Pre-load from intake redirect
  window.addEventListener('load', () => {
    try {
      const saved = sessionStorage.getItem('conflictCheck');
      if (saved) {
        const data = JSON.parse(saved);
        const queryCounty = data.queryCounty || data.county || 'N/A';
        const queryStartTime = data.queryStartTime || data.startTime;
        const queryEndTime = data.queryEndTime || data.endTime;
        result.style.display = 'block';
        result.innerHTML = '<strong>County:</strong> '+queryCounty+
          '<br><strong>Dates:</strong> '+(queryStartTime?fmtUTC(queryStartTime):'N/A')+
          ' to '+(queryEndTime?fmtUTC(queryEndTime):'N/A')+
          '<br><strong>Conflicts:</strong> '+(data.conflictCount||0);
        if(data.conflicts && data.conflicts.length){
          result.innerHTML += '<ul>' + data.conflicts.map(c=>'<li><strong>'+ (c.title||'Untitled') +'</strong> ('+(c.company||'Unknown')+') — '+(c.startTime?fmtUTC(c.startTime):'N/A')+' to '+(c.endTime?fmtUTC(c.endTime):'N/A')+'</li>').join('') + '</ul>';
          if (data.nearestWindow) {
            result.innerHTML += '<p style="margin-top:10px;color:#0d7d61;font-weight:700;">Remediation: the nearest available window for your project starts on <strong>'+fmtUTC(data.nearestWindow)+'</strong>.</p>';
          } else {
            const ends = data.conflicts.map(c => new Date(c.endTime || c.startTime)).filter(d => !isNaN(d));
            if (ends.length) {
              const latest = new Date(Math.max(...ends));
              const after = new Date(latest.getTime() + 24*60*60*1000);
              result.innerHTML += '<p style="margin-top:10px;color:#0d7d61;font-weight:700;">Remediation: the nearest available window for your project starts on <strong>'+fmtUTC(new Date(after.getTime()).toISOString())+'</strong>.</p>';
            }
          }
        }
        setStatus('Conflict check complete.', 'success');
        speakWizardConflict();
        sessionStorage.removeItem('conflictCheck');
      }
    } catch(e){}
    setTimeout(() => speakWizard('Ah, the conflict check, It seems a fellow wizard has already scheduled a project during that time. Go back to the previous page and edit your time selection using my orbs reccomendation.'), 800);
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const text = document.getElementById('textInput').value.trim();
    if(!text){ setStatus('Enter a description.', 'error'); return; }
    setStatus('Analyzing with Gemini + backend...');
    try{
      const res = await fetch('/api/ai/check-conflicts', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text})
      });
      const data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'Check failed'); }
      result.style.display = 'block';
      result.innerHTML = '<strong>County:</strong> '+(data.county||'N/A')+
        '<br><strong>Dates:</strong> '+(data.startTime?new Date(data.startTime).toLocaleDateString():'N/A')+
        ' to '+(data.endTime?new Date(data.endTime).toLocaleDateString():'N/A')+
        '<br><strong>Conflicts:</strong> '+(data.conflictCount||0)+
        '<br><strong>Title:</strong> '+(data.title||'N/A');
      if(data.conflicts && data.conflicts.length){
        result.innerHTML += '<ul>' + data.conflicts.map(c=>'<li><strong>'+ (c.title||'Untitled') +'</strong> ('+(c.company||'Unknown')+') — '+(c.startTime?fmtUTC(c.startTime):'N/A')+' to '+(c.endTime?fmtUTC(c.endTime):'N/A')+'</li>').join('') + '</ul>';
        const latestStr = data.nearestWindow ? fmtUTC(data.nearestWindow) : null;
        if (latestStr) {
          result.innerHTML += '<p style="margin-top:10px;color:#0d7d61;font-weight:700;">Remediation: the nearest available window for your project starts on <strong>'+latestStr+'</strong>.</p>';
        } else {
          const ends = data.conflicts.map(c => new Date(c.endTime || c.startTime)).filter(d => !isNaN(d));
          if (ends.length) {
            const latest = new Date(Math.max(...ends));
            const after = new Date(latest.getTime() + 24*60*60*1000);
            result.innerHTML += '<p style="margin-top:10px;color:#0d7d61;font-weight:700;">Remediation: the nearest available window for your project starts on <strong>'+fmtUTC(new Date(after.getTime()).toISOString())+'</strong>.</p>';
          }
        }
      }
      setStatus('Conflict check complete.', 'success');
      speakWizardConflict();
    }catch(err){
      setStatus(err.message || 'Error', 'error');
      result.style.display = 'none';
    }
  });
</script>
</body>
</html>
